services:
  postgres:
    image: postgres:16-alpine
    container_name: volonce-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-volonce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volonce_secret_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-volonce_billing}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-volonce_user} -d ${POSTGRES_DB:-volonce_billing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: volonce-prod-redis
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: volonce-prod-api
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-volonce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volonce_secret_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-volonce_billing}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-volonce_super_jwt_secret_key_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-volonce_wa_verify_2026}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TsaJVIkvM3i9jj}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-nqoEGJZxurIYyUzF7kUpFRuZ}
      VOLONIS_WEBHOOK_SECRET: ${VOLONIS_WEBHOOK_SECRET:-volonis_super_secure_secret_key_2026}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-volonce-storage}
      S3_REGION_NAME: ${S3_REGION_NAME:-auto}
    volumes:
      - storage_prod_data:/app/.storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: volonce-prod-worker
    restart: always
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info -c 2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-volonce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volonce_secret_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-volonce_billing}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-volonce_super_jwt_secret_key_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-volonce_wa_verify_2026}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TsaJVIkvM3i9jj}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-nqoEGJZxurIYyUzF7kUpFRuZ}
      VOLONIS_WEBHOOK_SECRET: ${VOLONIS_WEBHOOK_SECRET:-volonis_super_secure_secret_key_2026}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-volonce-storage}
      S3_REGION_NAME: ${S3_REGION_NAME:-auto}
    volumes:
      - storage_prod_data:/app/.storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: volonce-prod-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: volonce-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
      - api

  certbot:
    image: certbot/certbot:latest
    container_name: volonce-prod-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_prod_data:
  redis_prod_data:
  storage_prod_data:
  certbot_conf:
  certbot_www: