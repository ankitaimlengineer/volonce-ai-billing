name: Docker Production Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-containers:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          push: false
          tags: volonce-api:test

      - name: Build Next.js Web Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: false
          tags: volonce-web:test