events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 30M; # કેમેરા સ્કેન અને PDF અપલોડ માટે 30MB લિમિટ

    # Gzip Compression (વેબસાઇટ ઝડપી લોડ થાય તે માટે)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # WebSocket કનેક્શન મેપિંગ
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream web_upstream {
        server web:3000;
    }

    upstream api_upstream {
        server api:8000;
    }

    # =========================================================================
    # ૧. HTTP સર્વર (Port 80) — Let's Encrypt Challenge & HTTPS રીડાયરેક્ટ
    # =========================================================================
    server {
        listen 80;
        server_name _;

        # Let's Encrypt SSL રિન્યૂઅલ વેરિફિકેશન પાથ
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # બાકી તમામ ટ્રાફિકને સીધો સુરક્ષિત HTTPS પર રીડાયરેક્ટ કરો
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # ૨. HTTPS સર્વર (Port 443) — પ્રોડક્શન SSL રિવર્સ પ્રોક્સી
    # =========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # SSL સર્ટિફિકેટ પાથ (Let's Encrypt Certbot)
        ssl_certificate /etc/letsencrypt/live/volonce/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/volonce/privkey.pem;

        # આધુનિક અને સુરક્ષિત SSL કન્ફિગરેશન (A+ Grade Security)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers (સુરક્ષા માટે)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ---------------- Backend API Requests -> FastAPI ----------------
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # AI કેમેરા સ્કેન માટે ટાઈમઆઉટ (Timeout Prevention)
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ---------------- Next.js Static Assets Caching ----------------
        location /_next/static/ {
            proxy_pass http://web_upstream;
            proxy_cache_bypass $http_upgrade;
            expires 365d;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ---------------- Frontend Web App -> Next.js ----------------
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }
    }
}